services:
  - type: web
    name: tiqsey-admin
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build:admin
    startCommand: npm run start:admin
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: admin
      - key: VITE_APP_MODE
        value: admin
      - key: VITE_PUBLIC_SITE_URL
        value: https://tiqsey.com
      - key: VITE_ADMIN_SITE_URL
        value: https://admin.tiqsey.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://admin.tiqsey.com,https://tiqsey.com,https://www.tiqsey.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_STORAGE_BUCKET
        value: media
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
