name: Tiqsey CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "security/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The committed npm lockfile is currently out of sync with package.json.
      # npm install reconciles it in the ephemeral runner so checks can proceed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
